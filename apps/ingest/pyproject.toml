[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bellwether-ingest"
version = "0.1.0"
description = "Bee integration: bee-cli, bee stream, bee sync markdown and the local proxy, normalised to utterances and reduced to features before anything persists."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["speech-vitals>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bellwether-ingest = "bellwether_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bellwether_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
