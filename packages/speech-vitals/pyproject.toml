[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-vitals"
version = "0.1.0"
description = "Language features from everyday speech transcripts, for personal n-of-1 baselines. Features only, never words."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bellwether" }]
keywords = ["speech", "language", "nlp", "cognition", "baseline", "wellness"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "spacy>=3.8",
  "wordfreq>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
speech-vitals = "speech_vitals.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["speech_vitals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
